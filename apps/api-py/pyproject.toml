[project]
name = "simplecatch-api"
version = "0.0.0"
description = "SimpleCatch API (FastAPI), migrated module by module from apps/api"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
  "httpx>=0.28",
  "pillow>=11",
  "aiosmtplib>=5.1.3",
  "cryptography>=50.0.2",
  "aio-pika>=9.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "sqlacodegen>=3.0.0rc5", "psycopg2-binary>=2.9", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
"scripts/*" = ["E501"]
"app/integrations/email/templates.py" = ["E501"]
"app/modules/reports/events.py" = ["E501"]
"app/shared/site_render.py" = ["E501"]
"app/shared/site_templates.py" = ["E501"]
"app/shared/site.py" = ["E501"]
"app/public/app.py" = ["E501"]
"app/integrations/*/__init__.py" = ["E501"]
"app/modules/channels/*.py" = ["E501"]
"app/modules/whatsapp/*.py" = ["E501"]
"app/modules/conversations/*.py" = ["E501"]
"app/modules/sites/service.py" = ["E501"]
"app/modules/sites/routes.py" = ["E501"]
"app/modules/reports/visits.py" = ["E501"]
"app/db/models.py" = ["E501", "UP", "F401", "I"]
