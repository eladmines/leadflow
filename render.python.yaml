# The PYTHON deployment (FastAPI): one Docker web service runs the API, the web app and the
# customer sites (under /s/<name>). The database is Neon's free Postgres (DATABASE_URL).
# Step-by-step: docs/DEPLOY.md.
# Not used until the cutover: to switch Render over, make this the repo's render.yaml (and keep the
# landing page service below). The container stamps a Prisma-migrated database at the Alembic
# baseline on first start, then applies new migrations (apps/api-py/scripts/prepare_db.py).
services:
  - type: web
    name: leadflow
    runtime: docker
    dockerfilePath: ./apps/api-py/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # APP_URL and WEB_ORIGINS: set in the Render dashboard to https://app.simplecatch.co.il (docs/DEPLOY.md);
      # without them APP_URL defaults to Render's own address (RENDER_EXTERNAL_URL).
      - key: PUBLIC_SITE_MODE
        value: path
      - key: STORAGE_DRIVER
        value: database
      - key: FORM_TOKEN_SECRET
        generateValue: true
      # Render's free plan blocks SMTP ports, so email goes over HTTPS (Brevo) or is off (D-120).
      # To turn it on: set EMAIL_TRANSPORT to brevo here, and BREVO_API_KEY + EMAIL_FROM in Render.
      - key: EMAIL_TRANSPORT
        value: disabled
      # Set in the Render dashboard (never committed):
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # WhatsApp and Facebook (docs/DEPLOY.md, step 4). Leave empty while they are off.
      - key: WHATSAPP_PROVIDER
        sync: false
      # Facebook Messenger and Instagram send for real (without it replies are only recorded here).
      - key: MESSENGER_PROVIDER
        value: cloud
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      # Gmail conversations (docs/features/F29.md): the Google Cloud OAuth client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email conversations (docs/features/F27.md). Leave empty while they are off.
      - key: EMAIL_INBOUND_DOMAIN
        sync: false
      - key: EMAIL_INBOUND_SECRET
        sync: false
  # The public landing page: plain files, no build, free (apps/landing/README.md). It links to the
  # app above through APP_URL at the top of apps/landing/main.js.
  - type: web
    name: simplecatch-landing
    runtime: static
    staticPublishPath: apps/landing
    buildCommand: echo "Nothing to build, static files"
    branch: main
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
