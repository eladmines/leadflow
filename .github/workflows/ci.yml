name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadflow" --health-interval 2s --health-timeout 3s --health-retries 20
      # Catches the e2e's outgoing email (verify, reset, invite, reminder); same as docker-compose.
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow
      TEST_DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
      WEB_ORIGINS: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: The web app's API types match the Python API's OpenAPI schema
        run: pnpm --filter @simplecatch/web api:types && git diff --exit-code apps/web/src/api/generated.ts
      - run: pnpm test
      - run: pnpm build
      - uses: astral-sh/setup-uv@v5
      - name: Python API for the e2e (dependencies, and the dev database schema)
        run: cd apps/api-py && cp .env.example .env && uv sync --frozen && uv run python scripts/prepare_db.py
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # The Python API (apps/api-py): lint, the Alembic baseline on an empty database, the tests.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-py
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadflow" --health-interval 2s --health-timeout 3s --health-retries 20
      # The messaging worker's broker (D-202): test_inbound.py runs one test against it.
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Build the schema from the Alembic baseline
        run: uv run python scripts/prepare_db.py
      - name: openapi.json is up to date
        run: uv run python scripts/export_openapi.py --check
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest -q -rf --tb=short 2>&1 | tee pytest.log
      # The failing test names and their errors, as annotations on the run (visible without the log).
      - name: Show the failed tests
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::${line:0:500}"
          done
          grep -E '^E  ' pytest.log | head -20 | while IFS= read -r line; do
            echo "::error title=pytest detail::${line:0:500}"
          done
