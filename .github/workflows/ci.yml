name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadflow" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow
      TEST_DATABASE_URL: postgresql://leadflow:leadflow@localhost:5432/leadflow_test
      WEB_ORIGINS: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=leadflow psql -h localhost -U leadflow -c 'CREATE DATABASE leadflow_test'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Apply migrations to dev database (for e2e)
        run: pnpm --filter @leadflow/api db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: cp apps/api/.env.example apps/api/.env && pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
