services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
      POSTGRES_DB: leadflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadflow']
      interval: 2s
      timeout: 3s
      retries: 20

  # Catches all outgoing email locally. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '1025:1025'
      - '8025:8025'

  # Broker between the webhooks and the messaging worker (D-202). UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Traces from the API and the messaging worker (D-202). UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '4318:4318'
      - '16686:16686'

volumes:
  pgdata:
  rabbitmqdata:
